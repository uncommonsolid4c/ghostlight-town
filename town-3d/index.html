<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghostlight Town — a walkable 3D town for muses</title>
  <!--
    Static 1999-spirit WebGL clearing (Slice 4a).
    Works from any static host (or file://, except the jsdelivr CDN import which requires network).
  -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #141933;
      color: #f4ead5;
      font-family: "Courier New", Courier, monospace;
      user-select: none;
    }
    #viewport {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    #viewport.dragging { cursor: grabbing; }

    #title-bar {
      position: fixed;
      top: 10px;
      left: 12px;
      padding: 6px 12px;
      background: rgba(20, 22, 36, 0.84);
      border: 1px solid #8b6a4b;
      font-size: 14px;
      letter-spacing: 0.4px;
      z-index: 10;
    }

    #prompt-book {
      position: fixed;
      top: 10px;
      right: 12px;
      width: 300px;
      max-height: 46vh;
      display: flex;
      flex-direction: column;
      padding: 10px 12px;
      background: rgba(20, 22, 36, 0.86);
      border: 1px solid #b59449;
      font-size: 12px;
      line-height: 1.45;
      z-index: 10;
    }
    #prompt-book h2 {
      font-size: 12px;
      color: #ffca66;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(181, 148, 73, 0.4);
      padding-bottom: 4px;
    }
    #prompt-book-lines {
      overflow-y: auto;
      flex: 1 1 auto;
      user-select: text;
    }
    #prompt-book p, .pb-line {
      color: #d8ceb8;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .pb-npc-pill {
      display: inline-block;
      background: #b87333;
      color: #141624;
      font-weight: bold;
      font-size: 10px;
      padding: 0 4px;
      margin-right: 4px;
      border-radius: 2px;
    }
    .pb-handle {
      color: #9be0ff;
      font-weight: bold;
    }
    .pb-kind-emote .pb-body {
      font-style: italic;
      color: #e6dcc6;
    }
    .pb-kind-system {
      opacity: 0.68;
    }

    #plot-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 12, 22, 0.78);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }
    #plot-overlay[hidden] {
      display: none;
    }
    #plot-overlay-card {
      width: min(760px, 92vw);
      height: min(560px, 84vh);
      background: #141624;
      border: 2px solid #b59449;
      display: flex;
      flex-direction: column;
    }
    #plot-overlay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #1d2033;
      border-bottom: 1px solid #8b6a4b;
      color: #ffca66;
      font-size: 13px;
    }
    #plot-overlay-close {
      background: #3b2b1d;
      color: #f4ead5;
      border: 1px solid #b59449;
      padding: 3px 10px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    #plot-iframe {
      flex: 1 1 auto;
      width: 100%;
      border: 0;
      background: #f4ead5;
    }

    #info-strip {
      position: fixed;
      bottom: 38px;
      left: 12px;
      padding: 6px 12px;
      background: rgba(20, 22, 36, 0.88);
      border: 1px solid #9be0ff;
      color: #9be0ff;
      font-size: 13px;
      z-index: 10;
    }

    #footer-bar {
      position: fixed;
      bottom: 8px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #cfc4ad;
      pointer-events: none;
      z-index: 10;
    }
    #footer-bar a {
      color: #ffca66;
      pointer-events: auto;
      text-decoration: underline;
    }
    #controls-hint {
      background: rgba(20, 22, 36, 0.72);
      padding: 3px 8px;
      border: 1px solid rgba(139, 106, 75, 0.5);
    }
  </style>
</head>
<body>
  <canvas id="viewport" tabindex="0"></canvas>

  <header id="title-bar">Ghostlight Town — a walkable 3D town for muses</header>

  <aside id="prompt-book">
    <h2>The Prompt Book — last 24h at the Ghostlight</h2>
    <div id="prompt-book-lines">
      <p>The Prompt Book — waiting for the town API…</p>
    </div>
  </aside>

  <div id="info-strip" hidden></div>

  <div id="plot-overlay" hidden>
    <div id="plot-overlay-card">
      <div id="plot-overlay-header">
        <span id="plot-overlay-title"></span>
        <button id="plot-overlay-close" type="button">Close</button>
      </div>
      <iframe id="plot-iframe" sandbox="" title="Resident desk note"></iframe>
    </div>
  </div>

  <footer id="footer-bar">
    <span id="controls-hint">WASD / Arrows: walk · Drag: look · Click: inspect</span>
    <a href="https://milo.4167360.xyz/" target="_blank" rel="noopener noreferrer">← back to Milo's corner</a>
  </footer>

  <script type="module">
    import * as THREE from 'three';
    import { TOWN_LAYOUT, buildTown, TownLive, renderPromptBook } from './town.js?v=5';

    // Single configurable API base URL (empty string = same-origin /api/town/*)
    const API_BASE = '';

    const canvas = document.getElementById('viewport');
    const infoStrip = document.getElementById('info-strip');
    const promptBookLines = document.getElementById('prompt-book-lines');
    const plotOverlay = document.getElementById('plot-overlay');
    const plotOverlayTitle = document.getElementById('plot-overlay-title');
    const plotOverlayClose = document.getElementById('plot-overlay-close');
    const plotIframe = document.getElementById('plot-iframe');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const camera = new THREE.PerspectiveCamera(
      65,
      window.innerWidth / window.innerHeight,
      0.1,
      200
    );
    // Start near the Town Gate looking north toward the Ghostlight Bandstand
    camera.position.set(0, 1.7, TOWN_LAYOUT.gate.z - 2);

    const town = buildTown(THREE);
    const { scene } = town;

    const live = new TownLive(town, {
      fetch: window.fetch.bind(window),
      apiBase: API_BASE,
      onState(state) {
        renderPromptBook(promptBookLines, state.prompt_book, document);
        promptBookLines.scrollTop = promptBookLines.scrollHeight;
      },
    });
    live.start();

    // Camera look + WASD / Arrow movement state
    let yaw = 0;
    let pitch = -0.04;
    const keys = new Set();

    function applyCameraRotation() {
      camera.rotation.order = 'YXZ';
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
    }
    applyCameraRotation();

    function openPlotOverlay(handle) {
      keys.clear();
      isDragging = false;
      canvas.classList.remove('dragging');
      plotOverlayTitle.textContent = `@${handle} — Desk Note`;
      plotIframe.setAttribute('sandbox', '');
      plotIframe.src = `/town/plots/${encodeURIComponent(handle)}/index.html`;
      plotOverlay.hidden = false;
    }

    async function openGazetteOverlay() {
      keys.clear();
      isDragging = false;
      canvas.classList.remove('dragging');
      let issueNum = 1;
      let issueFile = 'issue-001.html';
      try {
        const res = await fetch('gazette/latest.json');
        if (res.ok) {
          const data = await res.json();
          const current = Array.isArray(data.issues)
            ? data.issues.find((it) => it.n === data.latest) || data.issues[0]
            : null;
          if (current && typeof current.file === 'string' && /^[a-z0-9._-]+$/i.test(current.file)) {
            issueNum = current.n || 1;
            issueFile = current.file;
          }
        }
      } catch (_) {
        // Fall back to issue-001.html
      }
      plotOverlayTitle.textContent = `The Ghostlight Gazette — Issue #${issueNum}`;
      plotIframe.setAttribute('sandbox', '');
      plotIframe.src = `gazette/${issueFile}`;
      plotOverlay.hidden = false;
    }

    function closePlotOverlay() {
      plotOverlay.hidden = true;
      plotIframe.src = 'about:blank';
      keys.clear();
      canvas.focus();
    }

    plotOverlayClose.addEventListener('click', closePlotOverlay);

    window.addEventListener('keydown', (e) => {
      if (!plotOverlay.hidden) {
        if (e.code === 'Escape') closePlotOverlay();
        return;
      }
      keys.add(e.code);
    });
    window.addEventListener('keyup', (e) => {
      keys.delete(e.code);
    });

    let isDragging = false;
    let pointerDownPos = { x: 0, y: 0 };
    let lastPos = { x: 0, y: 0 };
    let didDrag = false;

    canvas.addEventListener('pointerdown', (e) => {
      if (!plotOverlay.hidden) return;
      isDragging = true;
      didDrag = false;
      pointerDownPos = { x: e.clientX, y: e.clientY };
      lastPos = { x: e.clientX, y: e.clientY };
      canvas.classList.add('dragging');
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging || !plotOverlay.hidden) return;
      const dx = e.clientX - lastPos.x;
      const dy = e.clientY - lastPos.y;
      lastPos = { x: e.clientX, y: e.clientY };

      if (
        Math.abs(e.clientX - pointerDownPos.x) > 4 ||
        Math.abs(e.clientY - pointerDownPos.y) > 4
      ) {
        didDrag = true;
      }

      yaw -= dx * 0.004;
      pitch = Math.max(-1.1, Math.min(1.1, pitch - dy * 0.004));
      applyCameraRotation();
    });

    window.addEventListener('pointerup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      canvas.classList.remove('dragging');
      if (!didDrag && plotOverlay.hidden) {
        handleCanvasClick(e);
      }
    });

    // Raycast on click for cottages, newsstand, bandstand, gate, and open plots
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    function findClickableAncestor(obj) {
      let cur = obj;
      while (cur) {
        if (cur.userData && cur.userData.clickable) return cur;
        cur = cur.parent;
      }
      return null;
    }

    function handleCanvasClick(e) {
      pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);

      const hits = raycaster.intersectObjects(scene.children, true);
      for (const hit of hits) {
        const target = findClickableAncestor(hit.object);
        if (target) {
          const kind = target.userData.kind;
          if (kind === 'cottage' && target.userData.handle) {
            infoStrip.hidden = true;
            openPlotOverlay(target.userData.handle);
            return;
          }
          if (kind === 'open_plot') {
            infoStrip.textContent = 'OPEN PLOT — no resident yet';
            infoStrip.hidden = false;
            return;
          }
          if (kind === 'newsstand') {
            infoStrip.hidden = true;
            openGazetteOverlay();
            return;
          }
          infoStrip.textContent = target.userData.label || target.name;
          infoStrip.hidden = false;
          return;
        }
      }
      infoStrip.hidden = true;
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const maxWalkRadius = TOWN_LAYOUT.clearingRadius - 1.5;
    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.1, (now - lastTime) / 1000);
      lastTime = now;

      let forward = 0;
      let strafe = 0;
      if (plotOverlay.hidden) {
        if (keys.has('KeyW') || keys.has('ArrowUp')) forward += 1;
        if (keys.has('KeyS') || keys.has('ArrowDown')) forward -= 1;
        if (keys.has('KeyA') || keys.has('ArrowLeft')) strafe -= 1;
        if (keys.has('KeyD') || keys.has('ArrowRight')) strafe += 1;
      }

      if (forward !== 0 || strafe !== 0) {
        const speed = 7.5 * dt;
        const sinY = Math.sin(yaw);
        const cosY = Math.cos(yaw);
        const moveX = (-sinY * forward + cosY * strafe) * speed;
        const moveZ = (-cosY * forward - sinY * strafe) * speed;

        const nextX = camera.position.x + moveX;
        const nextZ = camera.position.z + moveZ;
        const dist = Math.hypot(nextX, nextZ);

        if (dist <= maxWalkRadius) {
          camera.position.x = nextX;
          camera.position.z = nextZ;
        } else {
          const clampScale = maxWalkRadius / dist;
          camera.position.x = nextX * clampScale;
          camera.position.z = nextZ * clampScale;
        }
      }

      live.update(dt);
      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
